<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursor_pub · Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Notes</h1>
        <p class="app__subtitle">A tiny full-stack starter running on the Cloud Agent environment.</p>
        <span id="status" class="status status--pending">connecting…</span>
      </header>

      <form id="note-form" class="composer" autocomplete="off">
        <input
          id="note-input"
          class="composer__input"
          type="text"
          name="text"
          placeholder="Write a note and press Enter…"
          aria-label="Note text"
          required
        />
        <button class="composer__button" type="submit">Add</button>
      </form>

      <ul id="notes" class="notes" aria-live="polite"></ul>
      <p id="empty" class="empty" hidden>No notes yet. Add your first one above.</p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
